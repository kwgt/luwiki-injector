[package]
name = "luwiki-injector"
version = "0.1.0"
edition = "2024"

[features]
default = []
measurement = []

[dependencies]
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
clap = { version = "=4.5.53", features = ["derive"] }
directories = "=6.0.0"
env_logger = "=0.10.2"
futures-core = { version = "=0.3.34", default-features = false }
gix = { version = "=0.88.0", features = [
    "blocking-http-transport-reqwest-rust-tls",
] }
log = "=0.4.34"
octocrab = { version = "=0.54.2", default-features = false, features = [
    "default-client",
    "jwt-rust-crypto",
    "retry",
    "rustls",
    "rustls-ring",
    "timeout",
] }
reqwest = { version = "=0.13.5", default-features = false, features = [
    "json",
    "query",
    "rustls",
    "stream",
] }
rpassword = "=7.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml = "=0.9.10"
url = "=2.5.8"
zip = "=8.6.0"
